[tool:pytest]
# Configuration for DB Runbook Finder tests
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (slower, external deps)
    performance: marks tests as performance tests
    error_handling: marks tests for error handling scenarios
    external_tools: marks tests that require external tool services
    slow: marks tests that are expected to take longer than 30 seconds

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test configuration
asyncio_mode = auto

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test timeouts
timeout = 30
timeout_method = thread

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PytestUnraisableExceptionWarning